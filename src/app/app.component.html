@if (isLoading()) {
  <div class="min-h-screen flex items-center justify-center bg-slate-950 text-xs text-slate-400">
    <div class="flex flex-col items-center gap-3">
      <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <span>Initializing enterprise HRMS session...</span>
    </div>
  </div>
} @else if (isLoginPage()) {
  <router-outlet></router-outlet>
} @else {
  <div class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-slate-900 selection:text-white">
    <app-header></app-header>
    <div class="flex flex-1 overflow-hidden">
      <app-sidebar></app-sidebar>
      <main class="flex-1 overflow-y-auto bg-slate-50/50">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}
